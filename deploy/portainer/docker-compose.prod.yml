services:
  waha:
    image: ${WAHA_IMAGE:?define WAHA_IMAGE (pin by digest)}
    container_name: ${WAHA_CONTAINER_NAME:-waha}
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Loopback only: admin access exclusively through an SSH tunnel
    ports:
      - '127.0.0.1:${WAHA_ADMIN_PORT:-3002}:3000/tcp'
    # Never attach to proxy_net (NPM)
    networks:
      - waha_net
    volumes:
      - waha_sessions:/app/.sessions
    environment:
      TZ: Europe/Lisbon
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_BASE_URL: http://${WAHA_CONTAINER_NAME:-waha}:3000
      WAHA_LOG_LEVEL: info
      WAHA_PRINT_QR: 'false'
      WHATSAPP_RESTART_ALL_SESSIONS: 'True'

      # Admin (master) key as sha512:<hash>; the plain key is kept offline
      WAHA_API_KEY: ${WAHA_API_KEY:?define WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-true}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?define WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?define WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_ENABLED: 'false'

      # Outbound reminders only: incoming attachments are not stored
      WHATSAPP_DOWNLOAD_MEDIA: 'false'
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WAHA_MEM_LIMIT:-1g}
    cpus: ${WAHA_CPUS:-1.0}
    pids_limit: 512
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

networks:
  # Created beforehand (docker network create waha_net) and shared with osteogest
  waha_net:
    name: ${WAHA_NETWORK:-waha_net}
    external: true

volumes:
  waha_sessions:
